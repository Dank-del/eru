name: Eru Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: eru_linux
          - os: macos-latest
            output_name: eru_macos
          - os: windows-latest
            output_name: eru_windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            autoconf automake libtool autopoint gettext \
            libssl-dev zlib1g-dev libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install autoconf automake libtool pkg-config gettext openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          vcpkg install curl:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=x64-windows" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: bash
        run: |
          EXTRA="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA="$EXTRA -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE -DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"
          fi
          if [ -n "${OPENSSL_ROOT_DIR:-}" ]; then
            EXTRA="$EXTRA -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv build/src/Release/eru.exe "${{ matrix.output_name }}"
          else
            mv build/src/eru "${{ matrix.output_name }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}

      - name: Attach binary to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output_name }}
